# CI/CD Workflow for Wafer BI Platform
# ----------------------------------
# Migrated from OCI Registry (OCIR) to GitHub Container Registry (GHCR) 
# to avoid OCI Free Tier service restrictions and credential issues.
# ----------------------------------
name: CI - Build and Push Images

on:
  push:
    branches: [ main ]
    # 只有當這些路徑下的檔案變動時，才觸發整個流水線（或特定 Job）
    # 注意：helm/ 的變動不需要重建 Image，ArgoCD 會直接同步
    paths:
      - 'services/**'
      - '.github/workflows/**'

permissions:
  contents: write
  packages: write

jobs:
  # 定義一個共用的準備步驟，例如處理名稱小寫
  setup:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.owner_lc.outputs.owner_lc }}
    steps:
      - id: owner_lc
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'

  # 這裡將四個服務拆成平行執行的 Job
  build-services:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [wafer-bi-backend, wafer-bi-frontend, api-gateway, user-service, ai-mcp-service, license-service]
        include:
          - service: wafer-bi-backend
            context: ./services/wafer-bi
          - service: wafer-bi-frontend
            context: ./services/frontend
          - service: api-gateway
            context: ./services/api-gateway
          - service: user-service
            context: ./services/user-service
          - service: ai-mcp-service
            context: ./services/ai-mcp-service
          - service: license-service
            context: ./services/license-service
    
    name: Build ${{ matrix.service }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: Wandalen/wretry.action@v1.3.0
        with:
          action: docker/login-action@v3
          with: |
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
          attempt_limit: 3
          attempt_delay: 10000

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ matrix.service }}:latest
            ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ matrix.service }}:${{ github.sha }}
          # 關鍵：啟用 GitHub Action 專用快取，沒改動的地方會直接跳過
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 供應鏈安全掃描：CRITICAL 漏洞直接讓這個 job 失敗，擋在 deploy-trigger 之前
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

  # 所有 Build 完成後，更新 Helm values 的 image tag。
  # ArgoCD 監看的是 helm/wafer-bi/（見 k8s/argocd-app.yaml），
  # 所以「只有」改 helm/wafer-bi/values.yaml 會觸發實際部署——改 k8s/legacy/ 沒有任何效果。
  # 新增服務時，下方的 bump 清單要同步更新（scripts/check-config-sync.py 會檢查）。
  deploy-trigger:
    needs: [setup, build-services]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump image tags in Helm values
        run: |
          # 逐一更新每個服務的 image tag，ArgoCD 偵測到 commit 後自動 Rollout
          for key in waferBackend waferFrontend apiGateway userService aiMcpService licenseService; do
            yq -i ".${key}.image.tag = \"${{ github.sha }}\"" helm/wafer-bi/values.yaml
          done

          # 設定 Git 使用者資訊並提交
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add helm/wafer-bi/values.yaml
          git commit -m "deploy: bump image tags to ${GITHUB_SHA:0:7} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
