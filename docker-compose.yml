# ====================================================================
# Wafer BI - 本地開發環境（docker compose up -d --build 一鍵啟動）
# --------------------------------------------------------------------
# ⚠️ 連動提醒：這裡只管「本地開發」。K8S 實際部署吃的是 helm/wafer-bi/
#    （ArgoCD 監看，見 k8s/README.md）。新增／刪除／改名服務時，
#    請同步更新 helm/wafer-bi/ 與 .github/workflows/deploy.yml，
#    並在 scripts/check-config-sync.py 的 MAPPING 登記——CI 會自動檢查。
# 例外：frontend 本地用 `npm run dev`（vite 熱更新），刻意不進 compose。
# ====================================================================
services:
  # ============ Infrastructure ============
  postgres:
    image: postgres:16-alpine
    container_name: k8sdemo-postgres
    environment:
      POSTGRES_USER: waferbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local_properties}
      POSTGRES_DB: waferbi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waferbi -d waferbi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Backend Services ============
  wafer-backend:
    build: ./services/wafer-bi
    container_name: k8sdemo-wafer-backend
    ports:
      - "8000:8000"

  user-service:
    build: ./services/user-service
    container_name: k8sdemo-user-service
    ports:
      - "3002:3002"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: waferbi_db
      POSTGRES_USER: waferbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local_properties}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_must_be_at_least_32_bytes}
      USER_SERVICE_PORT: "3002"
      # 種子帳號密碼：只給本地開發用。沒設定的話 DataSeeder 就不會建立帳號，
      # 正式環境刻意不在 helm/ 裡提供這兩個變數。
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin@carrot}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo@carrot}
    depends_on:
      postgres:
        condition: service_healthy

  # ============ API Gateway ============
  api-gateway:
    build: ./services/api-gateway
    container_name: k8sdemo-api-gateway
    ports:
      - "8080:8080"
    environment:
      API_GATEWAY_PORT: "8080"
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: "3002"
      WAFER_BI_HOST: wafer-backend
      WAFER_BI_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_must_be_at_least_32_bytes}
    depends_on:
      - user-service
      - wafer-backend

  ai-mcp-service:
    build: ./services/ai-mcp-service
    container_name: k8sdemo-ai-mcp-service
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DELTA_PATH: /app/wafer_delta_table
    volumes:
      - ./services/ai-mcp-service/chroma_db:/app/chroma_db
      - ./services/wafer-bi/wafer_delta_table:/app/wafer_delta_table
    depends_on:
      - api-gateway

  openbao:
    image: openbao/openbao:2.0.0
    container_name: wafer-openbao
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "root"
      BAO_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  license-service:
    build: ./services/license-service
    container_name: wafer-license-service
    ports:
      - "8005:8005"
    environment:
      VAULT_ADDR: "http://openbao:8200"
      VAULT_TOKEN: "root"
    depends_on:
      - openbao

volumes:
  postgres_data:
  chroma_data:
