{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "wafer-bi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        env: {{ .Values.global.environment }}
    spec:
      containers:
      - name: ollama
        image: {{ .Values.ollama.image | quote }}
        ports:
        - containerPort: 11434
          name: api
        resources:
          {{- toYaml .Values.ollama.resources | nindent 10 }}
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      - name: model-puller
        image: docker.io/curlimages/curl:8.7.1
        command:
        - sh
        - -c
        - |
          echo "Waiting for Ollama API to start..."
          until curl -s http://localhost:11434/ > /dev/null; do
            sleep 3
          done
          echo "Ollama is ready. Pulling model {{ .Values.ollama.model }}..."
          curl -X POST http://localhost:11434/api/pull -d '{"name": "{{ .Values.ollama.model }}"}'
          echo "Model pull command sent!"
          # Keep container running to prevent Kubernetes from restarting it
          tail -f /dev/null
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: ollama-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "wafer-bi.labels" . | nindent 4 }}
spec:
  selector:
    app: ollama
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
{{- end }}
