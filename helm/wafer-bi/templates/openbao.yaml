{{- if .Values.openbao.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "wafer-bi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      containers:
      - name: openbao
        image: {{ .Values.openbao.image | quote }}
        ports:
        - containerPort: 8200
        env:
        - name: BAO_DEV_ROOT_TOKEN_ID
          value: "root"
        - name: BAO_ADDR
          value: "http://0.0.0.0:8200"
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "wafer-bi.labels" . | nindent 4 }}
spec:
  selector:
    app: openbao
  ports:
  - protocol: TCP
    port: 8200
    targetPort: 8200
{{- end }}
