# ====================================================================
# SealedSecret —— 這份「密文」可以安心進公開 repo
# --------------------------------------------------------------------
# 用 kubeseal 以「叢集公鑰」加密，只有裝了 sealed-secrets controller
# 且持有對應私鑰的那座叢集解得開。controller 會把它還原成同名的
# 一般 Secret（app-secrets），供各服務 envFrom / secretKeyRef 使用。
#
# ⚠️ 密文與「某一座叢集的金鑰」綁定。換叢集（例如本機 -> OKE）必須
#    拿新叢集的公鑰重新封一次，不能直接搬這個檔案。
#
# 重新產生：
#   kubectl create secret generic app-secrets -n k8sdemo #     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... #     --from-literal=JWT_SECRET=... --from-literal=GEMINI_API_KEY=... #     --dry-run=client -o yaml | kubeseal --format yaml > $0
# ====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: k8sdemo
spec:
  encryptedData:
    GEMINI_API_KEY: 
    JWT_SECRET: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: app-secrets
      namespace: k8sdemo
