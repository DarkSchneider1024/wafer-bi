# ====================================================================
# Wafer BI - Default Helm Values (Development/General)
# --------------------------------------------------------------------
# ⚠️ 這裡是 K8S 部署的唯一真相來源（ArgoCD 監看 helm/wafer-bi/）。
#    - image.tag 由 CI（.github/workflows/deploy.yml）自動 bump，勿手改
#    - 新增／刪除服務時，請同步更新 docker-compose.yml（本地開發）
#      與 deploy.yml，並在 scripts/check-config-sync.py 登記 MAPPING
#    - 連動規則詳見 k8s/README.md
# ====================================================================

global:
  namespace: k8sdemo
  environment: development
  imagePullSecrets:
    - name: ocirsecret

# --- ConfigMap Defaults ---
waferConfig:
  viteApiUrl: "https://wafer.carrot-atelier.online/api"

appConfig:
  postgresHost: "postgres-service"
  postgresPort: "5432"
  postgresDb: "waferbi_db"
  userServicePort: "3002"
  waferBiHost: "wafer-backend-svc.k8sdemo.svc.cluster.local"
  waferBiPort: "8000"
  apiGatewayPort: "8080"
  nodeEnv: "production"
  logLevel: "info"
  aiMcpServiceHost: "ai-mcp-service"
  aiMcpServicePort: "8001"
  springLiquibaseEnabled: "true"

# --- Wafer Backend ---
waferBackend:
  replicas: 1
  image:
    repository: ghcr.io/darkschneider1024/wafer-bi-backend
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# --- Wafer Frontend ---
waferFrontend:
  replicas: 1
  image:
    repository: ghcr.io/darkschneider1024/wafer-bi-frontend
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- API Gateway ---
apiGateway:
  replicas: 1
  image:
    repository: ghcr.io/darkschneider1024/api-gateway
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

# --- User Service ---
userService:
  replicas: 1
  image:
    repository: ghcr.io/darkschneider1024/user-service
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- AI MCP Service ---
aiMcpService:
  replicas: 1
  image:
    repository: ghcr.io/darkschneider1024/ai-mcp-service
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  pvc:
    storage: 2Gi

# --- Postgres ---
postgres:
  image: public.ecr.aws/docker/library/postgres:16.1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  pvc:
    storage: 2Gi

# --- Jaeger (Observability) ---
jaeger:
  enabled: true
  image: docker.io/jaegertracing/all-in-one:1.60.0

# --- OTel Collector (Observability) ---
otelCollector:
  enabled: true
  image: docker.io/otel/opentelemetry-collector-contrib:0.90.0

# --- OpenBao (Security) ---
openbao:
  enabled: true
  image: docker.io/openbao/openbao:2.0.0

# --- License Service ---
licenseService:
  enabled: true
  image:
    repository: ghcr.io/darkschneider1024/license-service
    tag: a840fafd1ce53d38268e0f67ef001b4c2394cf09
    pullPolicy: Always

# --- Ollama (AI Model) ---
ollama:
  enabled: true
  image: docker.io/ollama/ollama:latest
  model: "qwen2.5:1.5b"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# --- AI VTuber（外部 repo：DarkSchneider1024/ai-vtuber）---
# image.tag 由 ai-vtuber repo 的 CI 回填（需要 WAFER_BI_DEPLOY_TOKEN），勿手改。
# 這個服務不在 services/ 底下，所以不列入 scripts/check-config-sync.py 的 MAPPING。
aiVtuber:
  enabled: true
  host: "vtuber.carrot-atelier.online"
  tlsSecret: "ai-vtuber-tls"
  image:
    repository: ghcr.io/darkschneider1024/ai-vtuber
    tag: latest
    pullPolicy: Always
  live:
    cooldownSeconds: 20   # 同一位觀眾兩次發言的最短間隔
    ipLimitPerMin: 6      # 同一 IP 每分鐘最多留言數
    maxQueue: 30          # 佇列上限，滿了就拒收
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

# --- Ingress ---
ingress:
  enabled: true
  className: "nginx"
  host: "wafer.carrot-atelier.online"
  tlsSecret: "wafer-bi-tls"
  clusterIssuer: "letsencrypt-prod"

# --- ArgoCD Ingress ---
argocdIngress:
  enabled: true
  host: "argo.carrot-atelier.online"
  tlsSecret: "wafer-bi-tls"
